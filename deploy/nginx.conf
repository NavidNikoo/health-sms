# Health SMS — Nginx reverse proxy config for EC2
# Copy to: /etc/nginx/conf.d/health-sms.conf
# Then:    sudo nginx -t && sudo systemctl restart nginx
#
# Replace YOUR_DOMAIN with your EC2 public IP or domain name.
# TLS certificates: use Certbot (Let's Encrypt) or an ACM cert via ALB/CloudFront.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- TLS certificates (Let's Encrypt / Certbot) ---
    # After running: sudo certbot --nginx -d YOUR_DOMAIN
    # Certbot will populate these paths automatically.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers (HIPAA-aligned) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.twilio.com wss://*.twilio.com;" always;

    # Proxy /api requests to Node.js backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
    }

    # Health check passthrough
    location = /health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # Block dot-files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}
